version: '2'
services:
  public-inbox-httpd:
    build: public-inbox
    restart: always
    expose:
      - "8080"
    volumes:
      - ./caml-list.git:/root/caml-list.git:ro
    command: public-inbox-httpd

  public-inbox-watch:
    build: public-inbox
    restart: always
    volumes:
      - ./caml-list.git:/root/caml-list.git:rw
    command: public-inbox-watch

  caddy:
    image: caddy
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy_data:/data
      - ./caddy_config:/config
